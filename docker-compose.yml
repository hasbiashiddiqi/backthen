services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backthen_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_HOST=db
      - DATABASE_PORT=3306
      - DATABASE_USER=${DATABASE_USER:-root}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-rootpassword}
      - DATABASE_NAME=${DATABASE_NAME:-backthen_db}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: docker.io/library/mysql:8.0
    container_name: backthen_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DATABASE_NAME:-backthen_db}
    ports:
      - "${DATABASE_PORT:-3306}:3306"
    volumes:
      - backthen_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DATABASE_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  backthen_mysql_data:
    driver: local
